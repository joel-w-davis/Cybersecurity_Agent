<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Agent Q&A</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            background-color: #f0f0f0;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cybersecurity Agent Q&A</h1>
    <input type="text" id="queryInput" placeholder="Enter your prompt">
    <button onclick="submitQuery()">Submit</button>
    <div class="result" id="result"></div>
</div>

<script>
    const API_URL = "https://cybersecurity-agent.vercel.app/ask"; // Flask API endpoint

    function submitQuery() {
        const query = document.getElementById('queryInput').value;
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '';  // Clear previous result

        if (!query) {
            resultDiv.innerHTML = '<p class="error">Please enter a prompt.</p>';
            return;
        }

        // Send POST request to Flask API
        fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ query: query })
        })
        .then(response => response.json())
        .then(data => {
            if (data.answer) {
                resultDiv.innerHTML = `<p class="success">Answer: ${data.answer}</p>`;
            } else if (data.error) {
                resultDiv.innerHTML = `<p class="error">Error: ${data.error}</p>`;
            } else {
                resultDiv.innerHTML = `<p class="error">An unknown error occurred.</p>`;
            }
        })
        .catch(error => {
            resultDiv.innerHTML = `<p class="error">An unexpected error occurred: ${error.message}</p>`;
        });
    }
</script>

</body>
</html>
